<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="심플하고 모던하며, 아름다운 디자인을 자랑하는 프리미엄 투두리스트 웹앱입니다. 할 일을 계획하고 관리하여 생산성을 높이세요.">
    <title>FocusFlow | 프리미엄 투두리스트</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Custom Script (defer) -->
    <script src="script.js" defer></script>
</head>
<body>
    <div class="background-gradients">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <i data-lucide="check-square"></i>
                </div>
                <h1>FocusFlow</h1>
            </div>
            <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="테마 전환" title="테마 전환">
                <i data-lucide="sun" class="sun-icon"></i>
                <i data-lucide="moon" class="moon-icon"></i>
            </button>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Todo Input Form -->
            <form id="todo-form" class="todo-form">
                <div class="input-wrapper">
                    <i data-lucide="plus-circle" class="input-icon"></i>
                    <input type="text" id="todo-input" autocomplete="off" placeholder="오늘 해야 할 일을 등록해 보세요..." required>
                </div>
                <button type="submit" class="submit-btn" aria-label="할 일 추가" title="할 일 추가">
                    <span>추가</span>
                    <i data-lucide="arrow-right"></i>
                </button>
            </form>

            <!-- Filters & Actions Bar -->
            <div class="filter-actions-bar">
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">전체</button>
                    <button class="filter-btn" data-filter="active">진행 중</button>
                    <button class="filter-btn" data-filter="completed">완료됨</button>
                </div>
                <button id="clear-completed-btn" class="clear-completed-btn">
                    <i data-lucide="trash-2"></i>
                    <span>완료 항목 삭제</span>
                </button>
            </div>

            <!-- Todo List -->
            <div class="todo-list-container">
                <ul id="todo-list" class="todo-list">
                    <!-- Javascript will inject list items here -->
                </ul>
                
                <!-- Empty State -->
                <div id="empty-state" class="empty-state">
                    <div class="empty-icon-wrapper">
                        <i data-lucide="sparkles" class="empty-icon"></i>
                    </div>
                    <h3>할 일 목록이 비어 있습니다</h3>
                    <p>오늘 할 일들을 채우고 활기차게 하루를 시작해 보세요!</p>
                </div>
            </div>
        </main>

        <!-- Footer / Summary -->
        <footer class="app-footer">
            <div class="todo-stats">
                <span id="items-left">0개의 할 일 남음</span>
            </div>
            <div class="credits">
                <p>&copy; 2026 FocusFlow. Designed beautifully.</p>
            </div>
        </footer>
    </div>
</body>
</html>
